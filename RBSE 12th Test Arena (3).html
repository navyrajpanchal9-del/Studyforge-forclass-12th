<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RBSE 12th Test Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --bg:#f4f5fb; --card:#ffffff; --text:#181a2a; --muted:#6b7280; --border:#e7e8f3;
  --p1:#0d9488; --p2:#4f46e5; --green:#16a34a; --red:#dc2626; --yellow:#d97706;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); box-sizing:border-box;
}
:root[data-theme="dark"]{ --bg:#0b0d1a; --card:#141728; --text:#eef0ff; --muted:#98a0c0; --border:#242844; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#0b0d1a; --card:#141728; --text:#eef0ff; --muted:#98a0c0; --border:#242844; } }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100%;margin:0;padding-bottom:64px;transition:background .2s,color .2s;}
h1,h2,h3,.font-head{font-family:'Poppins',sans-serif;}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;}
.grad{background:linear-gradient(135deg,var(--p1),var(--p2));}
.btn{border-radius:14px;font-weight:600;transition:.15s;padding:.7rem 1.2rem;}
.btn:active{transform:scale(.97);}
.chip{border-radius:999px;padding:.35rem .9rem;font-size:.8rem;font-weight:600;border:1px solid var(--border);cursor:pointer;}
.chip.active{background:var(--p1);color:#fff;border-color:var(--p1);}
input,select,textarea{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:.6rem .8rem;width:100%;}
::-webkit-scrollbar{height:6px;width:6px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.fade{animation:fade .25s ease;} @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.navbtn{color:var(--muted);} .navbtn.active{color:var(--p1);}
.topstrip{position:fixed;top:env(safe-area-inset-top,0px);right:0;display:flex;gap:6px;padding:8px;z-index:50;flex-wrap:wrap;justify-content:flex-end;max-width:70vw;}
.fab{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:45;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer;color:#fff;}
.panel{position:fixed;z-index:60;width:min(300px,90vw);max-height:70vh;overflow:auto;}
.drag-handle{cursor:grab;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;display:flex;align-items:flex-end;justify-content:center;}
.modal-bg.hidden{display:none;}
@media(min-width:640px){.modal-bg{align-items:center;}}
.star{font-size:1.6rem;cursor:pointer;color:var(--border);}
.star.on{color:var(--yellow);}
</style>
</head>
<body>
<div class="topstrip">
  <button onclick="nav('profile')" class="btn card px-3 py-2 text-sm">👤</button>
  <button onclick="toggleFeedback()" class="btn card px-3 py-2 text-sm">💬 Feedback</button>
  <button onclick="openHelp()" class="btn card px-3 py-2 text-sm">🆘 Help</button>
</div>
<div id="app" class="max-w-5xl mx-auto px-4 pb-6"></div>

<div class="fab" style="left:14px;background:var(--p1)" onclick="toggleCalc()">🧮</div>
<div class="fab" style="right:14px;background:var(--p2)" onclick="toggleDoubt()">💡</div>

<div id="calcPanel" class="panel card p-3 hidden" style="left:14px;bottom:130px">
  <div class="drag-handle flex justify-between items-center mb-2 font-semibold" id="calcHandle">🧮 Calculator <button onclick="toggleCalc()">✕</button></div>
  <input id="calcDisplay" readonly class="text-right text-xl mb-2" value="0">
</div>

<div id="doubtPanel" class="panel card p-3 hidden" style="right:14px;bottom:130px">
  <div class="flex justify-between items-center mb-2 font-semibold">💡 AI Doubt Solver <button onclick="toggleDoubt()">✕</button></div>
  <div class="text-xs mb-2" style="color:var(--muted)">Ask anything — in the RBSE syllabus or beyond it.</div>
  <textarea id="doubtInput" rows="2" placeholder="e.g. Why does force decrease when distance increases?"></textarea>
  <button class="btn grad text-white w-full mt-2" onclick="askDoubt()">Ask</button>
  <div id="doubtAnswer" class="text-sm mt-3"></div>
</div>

<div id="infoModal" class="modal-bg hidden" onclick="if(event.target===this)closeInfoModal()">
  <div class="card p-5 w-full sm:w-96 fade" id="infoModalBody"></div>
</div>

<div id="feedbackModal" class="modal-bg hidden" onclick="if(event.target===this)toggleFeedback()">
  <div class="card p-5 w-full sm:w-96 fade">
    <div class="font-head font-bold text-lg mb-2">Send Feedback</div>
    <textarea id="fbText" rows="4" placeholder="Tell us what to fix or improve..."></textarea>
    <button class="btn grad text-white w-full mt-3" onclick="sendFeedback()">Send</button>
    <div id="fbStatus" class="text-xs mt-2" style="color:var(--muted)"></div>
  </div>
</div>

<nav class="fixed bottom-0 left-0 right-0 card !rounded-none border-t flex justify-around py-2 z-40" style="padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px)">
  <button onclick="nav('home')" class="navbtn flex flex-col items-center text-xs gap-0.5 px-3 py-1" data-r="home">🏠<span>Home</span></button>
  <button onclick="nav('subjects')" class="navbtn flex flex-col items-center text-xs gap-0.5 px-3 py-1" data-r="subjects">📚<span>Subjects</span></button>
  <button onclick="nav('daily')" class="navbtn flex flex-col items-center text-xs gap-0.5 px-3 py-1" data-r="daily">📝<span>Daily</span></button>
  <button onclick="nav('dashboard')" class="navbtn flex flex-col items-center text-xs gap-0.5 px-3 py-1" data-r="dashboard">📊<span>Progress</span></button>
  <button onclick="nav('extra')" class="navbtn flex flex-col items-center text-xs gap-0.5 px-3 py-1" data-r="extra">📄<span>Extra</span></button>
</nav>

 {id:"phy_007",subject:"Physics",chapter:"Electrostatic Potential and Capacitance",topic:"Capacitance",difficulty:"Easy",type:"MCQ",question:"The SI unit of capacitance is:",options:["Farad","Henry","Ohm","Tesla"],correctAnswer:0,explanation:"Capacitance C = Q/V is measured in Farad (F), named after Michael Faraday."},
 {id:"phy_008",subject:"Physics",chapter:"Magnetic Effects of Current",topic:"Biot-Savart Law",difficulty:"Medium",type:"Conceptual",question:"The magnetic field due to a long straight current-carrying wire, at a point outside it, is proportional to:",options:["1/r","r","1/r²","r²"],correctAnswer:0,explanation:"By the Biot-Savart law, B = μ0I/2πr, so B is inversely proportional to distance r."},
 {id:"phy_009",subject:"Physics",chapter:"Electromagnetic Induction",topic:"Faraday's Law",difficulty:"Easy",type:"MCQ",question:"The induced EMF in a coil mainly depends on:",options:["Rate of change of magnetic flux","Resistance of the coil only","Current in the coil only","Charge on the coil only"],correctAnswer:0,explanation:"Faraday's law states induced EMF = −dφ/dt, i.e. it depends on the rate of change of magnetic flux."},
 {id:"phy_010",subject:"Physics",chapter:"Atoms and Nuclei",topic:"Radioactivity",difficulty:"Medium",type:"True/False",question:"The half-life of a radioactive substance is independent of the initial quantity present.",options:["True","False"],correctAnswer:0,explanation:"Radioactive decay is a first-order process, so half-life is a constant property of the substance, independent of quantity."},
 {id:"che_004",subject:"Chemistry",chapter:"Solid State",topic:"Unit Cells",difficulty:"Medium",type:"MCQ",question:"The number of atoms per unit cell in a face-centred cubic (FCC) lattice is:",options:["2","4","6","8"],correctAnswer:1,explanation:"FCC has atoms at 8 corners (1/8 each = 1) and 6 face centres (1/2 each = 3), totalling 4 atoms per unit cell."},
 {id:"che_005",subject:"Chemistry",chapter:"p-Block Elements",topic:"Nitrogen Family",difficulty:"Easy",type:"MCQ",question:"In the Haber process, ammonia is manufactured from hydrogen and:",options:["Oxygen","Nitrogen","Carbon dioxide","Argon"],correctAnswer:1,explanation:"The Haber process combines N₂ and H₂ under high pressure and catalyst to form NH₃."},
 {id:"che_006",subject:"Chemistry",chapter:"Coordination Compounds",topic:"Werner's Theory",difficulty:"Medium",type:"MCQ",question:"In the complex [Co(NH3)6]3+, the coordination number of cobalt is:",options:["4","5","6","8"],correctAnswer:2,explanation:"Six NH3 ligands are directly bonded to the central Co ion, giving a coordination number of 6."},
 {id:"mat_003",subject:"Mathematics",chapter:"Continuity and Differentiability",topic:"Differentiability",difficulty:"Medium",type:"Conceptual",question:"Every differentiable function is necessarily:",options:["Discontinuous","Continuous","Neither continuous nor discontinuous","Always increasing"],correctAnswer:1,explanation:"Differentiability implies continuity — a function must be continuous at a point to be differentiable there."},
 {id:"mat_004",subject:"Mathematics",chapter:"Probability",topic:"Conditional Probability",difficulty:"Medium",type:"Numerical",question:"If P(A)=0.4, P(B)=0.5 and P(A∩B)=0.2, then P(A|B) is:",options:["0.2","0.4","0.5","0.8"],correctAnswer:1,explanation:"P(A|B) = P(A∩B)/P(B) = 0.2/0.5 = 0.4."},
 {id:"mat_005",subject:"Mathematics",chapter:"Determinants",topic:"Properties",difficulty:"Easy",type:"True/False",question:"If two rows (or columns) of a determinant are identical, its value is zero.",options:["True","False"],correctAnswer:0,explanation:"This is a standard property of determinants — identical rows/columns make the determinant vanish."},
 {id:"acc_003",subject:"Accountancy",chapter:"Dissolution of Partnership Firm",topic:"Realisation Account",difficulty:"Medium",type:"MCQ",question:"On dissolution, an unrecorded asset when realised in cash is credited to:",options:["Partners' Capital Account","Realisation Account","Cash Account","Bank Account"],correctAnswer:1,explanation:"All realisation transactions, including unrecorded assets sold, are routed through the Realisation Account."},
 {id:"acc_004",subject:"Accountancy",chapter:"Financial Statement Analysis",topic:"Ratio Analysis",difficulty:"Easy",type:"MCQ",question:"Current Ratio is calculated as:",options:["Current Assets / Current Liabilities","Fixed Assets / Current Liabilities","Net Profit / Sales","Equity / Debt"],correctAnswer:0,explanation:"Current Ratio measures short-term liquidity: Current Assets divided by Current Liabilities."},
 {id:"his_002",subject:"History",chapter:"Kinship Caste and Class",topic:"Epics",difficulty:"Easy",type:"MCQ",question:"The Mahabharata is traditionally attributed to:",options:["Valmiki","Ved Vyasa","Kalidasa","Tulsidas"],correctAnswer:1,explanation:"The Mahabharata is traditionally credited to sage Ved Vyasa."},
 {id:"his_003",subject:"History",chapter:"Framing the Constitution",topic:"Constituent Assembly",difficulty:"Easy",type:"MCQ",question:"Who was the Chairman of the Drafting Committee of the Indian Constitution?",options:["Jawaharlal Nehru","B.R. Ambedkar","Rajendra Prasad","Sardar Patel"],correctAnswer:1,explanation:"B.R. Ambedkar chaired the Drafting Committee that prepared the Constitution's draft."},
 {id:"bio_003",subject:"Biology",chapter:"Evolution",topic:"Natural Selection",difficulty:"Easy",type:"MCQ",question:"The theory of Natural Selection was proposed by:",options:["Lamarck","Charles Darwin","Gregor Mendel","Hugo de Vries"],correctAnswer:1,explanation:"Charles Darwin proposed Natural Selection as the mechanism driving evolution in 'On the Origin of Species'."},
 {id:"bs_002",subject:"Business Studies",chapter:"Marketing Management",topic:"Marketing Mix",difficulty:"Easy",type:"MCQ",question:"Which of these is NOT one of the 4 Ps of the marketing mix?",options:["Product","Price","Promotion","Profit"],correctAnswer:3,explanation:"The 4 Ps are Product, Price, Place and Promotion — Profit is an outcome, not a marketing mix element."},
 {id:"eco_002",subject:"Economics",chapter:"Money and Banking",topic:"Functions of Money",difficulty:"Easy",type:"MCQ",question:"The primary function of money is to act as a:",options:["Store of value","Medium of exchange","Unit of investment","Standard of living"],correctAnswer:1,explanation:"Money's primary function is as a medium of exchange, replacing barter; store of value is a secondary function."},
 {id:"pol_002",subject:"Political Science",chapter:"Contemporary South Asia",topic:"SAARC",difficulty:"Easy",type:"MCQ",question:"SAARC (South Asian Association for Regional Cooperation) was established in:",options:["1975","1980","1985","1990"],correctAnswer:2,explanation:"SAARC was founded in 1985 to promote regional cooperation among South Asian nations."},
 {id:"geo_002",subject:"Geography",chapter:"Manufacturing Industries",topic:"Industry Classification",difficulty:"Easy",type:"MCQ",question:"The Iron and Steel industry is classified as a:",options:["Agro-based industry","Mineral-based industry","Forest-based industry","Marine-based industry"],correctAnswer:1,explanation:"Iron and Steel industries use mineral raw materials (iron ore, coal), so they're mineral-based."},

/* ---- Robust nav/back: track how many states WE pushed so goBack() never
   calls history.back() past our own base state (which was the bug that made
   the arrow/hardware-back feel like it "closed" the site). ---- */
let navDepth=0;
function nav(route,params={},fromPop){
  state.route=route;state.params=params;
  if(!fromPop){ navDepth++; history.pushState({route,params,depth:navDepth},'','#'+route); }
  render(); window.scrollTo(0,0);
}
function goBack(){
  if(navDepth>0){ history.back(); } else { nav('home',{},true); }
}
window.addEventListener('popstate',e=>{
  const s=e.state||{route:'home',params:{},depth:0};
  navDepth=s.depth||0;
  nav(s.route,s.params,true);
});
history.replaceState({route:'home',params:{},depth:0},'','#home');

/* ============ AI TEST GENERATOR (client-side simulation) ============ */
/* ============ PARAMETERIZED QUESTION TEMPLATES ============
   A hand-written seed bank tops out at a few dozen questions per subject.
   For numeric subjects, each template below randomizes its numbers on every
   call and recomputes the correct answer + explanation from scratch — so one
   template can produce hundreds/thousands of genuinely different instances,
   not a fixed list being reshuffled. This is how real numeric-MCQ generators
   work without needing a live AI call. It only works for calculation-based
   subjects; fact/literature subjects (Hindi, History, etc.) still rely on the
   hand-written bank — see the note at the end of this reply.
*/
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function makeMCQ(base,optionValues,correctIndex){
  const idx=[...optionValues.keys()].sort(()=>Math.random()-0.5);
  return {...base,id:'t_'+base.topic.replace(/\s+/g,'')+'_'+Math.random().toString(36).slice(2,8),
    options:idx.map(i=>String(optionValues[i])), correctAnswer:idx.indexOf(correctIndex)};
}
const QTEMPLATES=[
 {subject:"Physics",chapter:"Electric Charges and Fields",topic:"Coulomb's Law",gen(){
   const q1=randInt(1,9),q2=randInt(1,9),r=randInt(1,5);
   const F=Math.round(90*q1*q2/(r*r)*100)/100;
   return makeMCQ({subject:"Physics",chapter:"Electric Charges and Fields",topic:"Coulomb's Law",difficulty:"Medium",type:"Numerical",
     question:`Two point charges of ${q1} μC and ${q2} μC are placed ${r} cm apart. Using F = kq₁q₂/r² (k = 9×10⁹ Nm²/C²), find the force between them.`,
     explanation:`F = kq₁q₂/r² = 9×10⁹ × ${q1}×10⁻⁶ × ${q2}×10⁻⁶ / (${r}×10⁻²)² ≈ ${F} N.`},
     [F+' N',(F*2).toFixed(2)+' N',(F/2).toFixed(2)+' N',(F+10).toFixed(2)+' N'],0);
 }},

 }},
 {subject:"Chemistry",chapter:"Solutions",topic:"Mole Concept",gen(){
   const opts=[["H₂O",18],["CO₂",44],["NaCl",58.5],["H₂SO₄",98]];

   const moles=(mass/M).toFixed(2);
   return makeMCQ({subject:"Chemistry",chapter:"Solutions",topic:"Mole Concept",difficulty:"Easy",type:"Numerical",
     question:`Calculate the number of moles in ${mass} g of ${name} (molar mass = ${M} g/mol).`,
     explanation:`Moles = given mass / molar mass = ${mass}/${M} = ${moles} mol.`},

   const M=(moles/volume).toFixed(2);

     question:`${moles} mol of solute is dissolved in ${volume} L of solution. Find the molarity.`,

     [M+' mol/L',(M*2).toFixed(2)+' mol/L',(M/2).toFixed(2)+' mol/L',(Number(M)+0.5).toFixed(2)+' mol/L'],0);

     [`${k}x^${n-1}`,`${a}x^${n-1}`,`${k}x^${n}`,`${a}x^${n}`],0);
 }},

 {subject:"English",chapter:"Grammar",topic:"Subject-Verb Agreement",gen(){

   return makeMCQ({subject:"English",chapter:"Grammar",topic:"Subject-Verb Agreement",difficulty:"Easy",type:"MCQ",
     question:`Choose the grammatically correct sentence using the subject '${subj}' and the verb '${verb}':`,
     explanation:`With the subject '${subj}', the verb must ${addS?"take an 's' (third-person singular)":"NOT take an 's'"} — so '${subj} ${correctForm} daily.' is correct.`},
     [`${subj} ${correctForm} daily.`,`${subj} ${wrongForm} daily.`,`${subj} ${verb}ing daily.`,`${subj} ${verb} to daily.`],0);

function fromTemplates(subject,chapter,minCount){
  const applicable=QTEMPLATES.filter(t=>t.subject===subject && (chapter==='All'||t.chapter===chapter));
  let out=[];
  applicable.forEach(t=>{ for(let i=0;i<Math.max(8,minCount);i++) out.push(t.gen()); });
  return out;
}

function generateTest({subject,chapter,count,difficulty,type}){
  let pool = subject==='All' ? QBANK.slice() : QBANK.filter(q=>q.subject===subject && (chapter==='All'||q.chapter===chapter));
  let widened=false;
  // If a specific CHAPTER doesn't have enough unique questions, widen to the
  // whole SUBJECT (still the same subject — e.g. more Hindi chapters, never Physics).
  // We must never cross into a different subject here, or a Hindi/English test
  // would start showing Physics/Chemistry questions, which is exactly the bug this fixes.
  if(pool.length < Math.min(count,4) && subject!=='All' && chapter!=='All'){
    pool = QBANK.filter(q=>q.subject===subject); widened=true;
  }
  // Mix in freshly-generated template instances (randomized numbers each call —
  // genuinely different questions, not a fixed list) for subjects that have them.
  if(subject==='All'){
    QTEMPLATES.forEach(t=>{ for(let i=0;i<4;i++) pool.push(t.gen()); });
  } else {
    pool = pool.concat(fromTemplates(subject,chapter,count));
  }
  if(difficulty && difficulty!=='Mixed') pool=pool.filter(q=>q.difficulty===difficulty).concat(pool.filter(q=>q.difficulty!==difficulty));
  if(type && type!=='Mixed') pool=pool.filter(q=>q.type===type).concat(pool.filter(q=>q.type!==type));
  const seen=new Set(state.history);
  pool=[...pool].sort((a,b)=>(seen.has(a.id)?1:0)-(seen.has(b.id)?1:0));
  if(pool.length===0) return [];
  // shuffle first so any necessary repeats are spread out, not back-to-back
  const shuffled=[...pool].sort(()=>Math.random()-0.5);
  let picked=[];
  for(let i=0;i<count;i++) picked.push(shuffled[i%shuffled.length]);
  picked=picked.map(q=>{
    const idx=[...Array(q.options.length).keys()].sort(()=>Math.random()-0.5);
    return {...q,options:idx.map(i=>q.options[i]),correctAnswer:idx.indexOf(q.correctAnswer)};
  });
  picked.sort(()=>Math.random()-0.5);
  picked._uniquePool=pool.length; picked._widened=widened;
  return picked;
}

/* ============ FLOATING WIDGETS ============ */
function toggleCalc(){document.getElementById('calcPanel').classList.toggle('hidden');buildCalc();}
function buildCalc(){
  const p=document.getElementById('calcPanel');
  if(p.dataset.built)return; p.dataset.built='1';
  const keys=['7','8','9','/','4','5','6','*','1','2','3','-','C','0','.','=','+'];
  const grid=document.createElement('div'); grid.className='grid grid-cols-4 gap-1';
  keys.forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className='btn card';b.onclick=()=>calcPress(k);grid.appendChild(b);});
  p.appendChild(grid);
  let dragging=false,ox=0,oy=0;
  const handle=document.getElementById('calcHandle');
  handle.addEventListener('pointerdown',e=>{dragging=true;ox=e.clientX-p.offsetLeft;oy=e.clientY-p.offsetTop;});
  window.addEventListener('pointermove',e=>{if(dragging){p.style.left=(e.clientX-ox)+'px';p.style.top=(e.clientY-oy)+'px';p.style.bottom='auto';}});
  window.addEventListener('pointerup',()=>dragging=false);
}
let calcExpr='';
function calcPress(k){
  const d=document.getElementById('calcDisplay');
  if(k==='C'){calcExpr='';} else if(k==='='){try{calcExpr=String(Function('"use strict";return('+calcExpr+')')());}catch(e){calcExpr='Error';}}
  else calcExpr+=k;
  d.value=calcExpr||'0';
}
function toggleDoubt(){document.getElementById('doubtPanel').classList.toggle('hidden');}
function askDoubt(){
  const raw=document.getElementById('doubtInput').value.trim();
  const q=raw.toLowerCase();
  const box=document.getElementById('doubtAnswer');
  if(!q){box.textContent='Type a question first.';return;}
  const words=q.split(/\s+/).filter(w=>w.length>3);
  let best=null,bestScore=0;
  QBANK.forEach(item=>{
    const text=(item.topic+' '+item.chapter+' '+item.question).toLowerCase();
    const score=words.filter(w=>text.includes(w)).length;
    if(score>bestScore){bestScore=score;best=item;}
  });
  if(best&&bestScore>0){
    box.innerHTML=`<b>${best.topic} (${best.subject} — ${best.chapter}):</b><br>${best.explanation}`;
  } else {
    box.innerHTML=`That's a fair question — it may sit outside our seeded RBSE Class 12 bank, in or out of the syllabus, but here's the honest picture: this demo can only match against the sample questions it has, so I can't give you a reliable answer to that specific one yet. Try naming a subject, chapter or topic and I'll do my best with what's here. (A live version would call a real AI model that can answer any question — in or out of syllabus — and would clearly label anything outside the RBSE Class 12 syllabus so you don't confuse it with exam content.)`;
  }
}

let setupSel={count:20,difficulty:'Mixed',type:'Mixed'};
function pick(groupId,el,key,val){
  document.querySelectorAll('#'+groupId+' .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active'); setupSel[key]=val;
  if(key==='count') document.getElementById('timeShow').textContent=val;
}
let pendingTest=null;
function startTest(subject,chapter,isDaily){
  const qs=generateTest({subject,chapter,count:setupSel.count,difficulty:setupSel.difficulty,type:setupSel.type});
  if(qs.length===0){showInfo('No questions yet','Questions are being prepared for this selection. Try Physics, Chemistry, Mathematics, Accountancy or History, or pick "All Subjects".');return;}
  if(qs._uniquePool < qs.length){
    pendingTest={qs,subject,chapter,isDaily};
    showInfo('Limited question bank right now',
      'Only '+qs._uniquePool+' unique question(s) are available for this selection, so some will repeat in this test. We\'re actively expanding the bank — Physics, Chemistry, Mathematics, Accountancy and History currently have the most variety.',
      `<button class="btn grad text-white w-full mt-3" onclick="closeInfoModal();launchPendingTest()">Continue Anyway</button>
       <button class="btn card w-full mt-2" onclick="closeInfoModal()">Change Settings</button>`);
    return;
  }
  launchTest(qs,subject,chapter,isDaily);
}
function launchPendingTest(){ if(pendingTest){ launchTest(pendingTest.qs,pendingTest.subject,pendingTest.chapter,pendingTest.isDaily); pendingTest=null; } }
function launchTest(qs,subject,chapter,isDaily){
  state.test={subject,chapter,isDaily:!!isDaily,questions:qs,answers:Array(qs.length).fill(null),cur:0,total:qs.length*60,remaining:qs.length*60,start:Date.now()};
  nav('test'); startTimer();
}
let timerInt=null;
function startTimer(){
  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    if(!state.test||state.route!=='test'){clearInterval(timerInt);return;}
    state.test.remaining--;
    const t=document.getElementById('timerShow');
    if(t) t.textContent=fmtTime(state.test.remaining);
    if(state.test.remaining<=0){clearInterval(timerInt);submitTest();}
  },1000);
}
function fmtTime(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}

function viewTest(){

  return `<div class="fade">

  </div>

    </div>

function answer(i){state.test.answers[state.test.cur]=i;render();}
function stepQ(d){state.test.cur+=d;render();}
function goQ(i){state.test.cur=i;render();}
function confirmSubmit(){
  showInfo('Submit Test?','Are you sure you want to submit? You won\'t be able to change your answers after this.',
    `<div class="flex gap-2 mt-3">
       <button class="btn card flex-1" onclick="closeInfoModal()">Cancel</button>
       <button class="btn text-white flex-1" style="background:var(--green)" onclick="closeInfoModal();submitTest()">Submit Test</button>
     </div>`);
}
function submitTest(){
  clearInterval(timerInt);
  const t=state.test;
  let correct=0,wrong=0,skipped=0;
  t.questions.forEach((q,i)=>{
    state.history.push(q.id);
    if(t.answers[i]===null) skipped++; else if(t.answers[i]===q.correctAnswer) correct++; else wrong++;
  });
  localStorage.setItem('rbse_hist',JSON.stringify(state.history.slice(-500)));
  const timeTaken=t.total-t.remaining;
  const pct=Math.round(correct/t.questions.length*100);
  const result={subject:t.subject,chapter:t.chapter,correct,wrong,skipped,total:t.questions.length,pct,timeTaken,questions:t.questions,answers:t.answers,date:Date.now()};
  state.results.unshift(result);
  localStorage.setItem('rbse_results',JSON.stringify(state.results.slice(0,20)));
  state.lastResult=result; state.lastRating=0;
  if(t.subject!=='All' && t.chapter!=='All') updateProgress(t.subject,t.chapter,pct);
  if(t.isDaily){
    const prev=JSON.parse(localStorage.getItem('rbse_daily')||'{"last":0,"streak":0}');
    const diffH=(Date.now()-prev.last)/3600000;
    const streak=diffH<48?prev.streak+1:1;
    localStorage.setItem('rbse_daily',JSON.stringify({last:Date.now(),streak}));
  }
  nav('result');
}

  </div>
  <div class="mb-4">
    <div class="text-xs font-semibold mb-1" style="color:var(--muted)">Topic / Chapter</div>
    <div class="flex gap-2 flex-wrap">${chaptersForSub.map(c=>`<span class="chip ${c.chapter===chapter?'active':''}" onclick="nav('${state.route}',{subject:'${sub}',chapter:'${c.chapter}'})">${c.chapter}</span>`).join('')}</div>
  </div>
  <div class="card p-4 fade">
    ${entry?`<div class="font-semibold mb-2">${sub} — ${chapter}</div>
      <ul class="text-sm list-disc pl-5" style="color:var(--muted)">${entry[itemsKey].map(pt=>`<li class="mb-1">${pt}</li>`).join('')}</ul>
      ${entry.derivation?`<div class="mt-4 pt-3" style="border-top:1px solid var(--border)">
        <div class="font-semibold text-sm mb-2">📐 Step-by-Step Derivation</div>
        <ol class="text-sm list-decimal pl-5" style="color:var(--muted)">${entry.derivation.map(st=>`<li class="mb-1">${st}</li>`).join('')}</ol>
      </div>`:''}`
      :`<div class="text-center" style="color:var(--muted)">More ${title.toLowerCase()} for ${sub} are being prepared.</div>`}
  </div>
  <div class="text-xs mt-4" style="color:var(--muted)">More subjects and chapters are added over time.</div>`;
}
function viewNotes(){ return topicTabPage('Short Notes',NOTES,'points','goBack()'); }
function viewFormulas(){ return topicTabPage('Formula Sheet',FORMULAS,'items','goBack()'); }

function viewBookmarks(){
  const qs=QBANK.filter(q=>state.bmQ.includes(q.id));
  const ms=PDFS.filter(p=>state.bmM.includes(p.id));
  return `${Header('My Bookmarks','goBack()')}
  <h3 class="font-head font-bold mb-2">Questions</h3>
  <div class="grid gap-2 mb-6">${qs.length?qs.map(q=>`<div class="card p-3">${q.question}</div>`).join(''):`<div class="card p-4 text-center" style="color:var(--muted)">No bookmarked questions yet.</div>`}</div>
  <h3 class="font-head font-bold mb-2">Study Material</h3>
  <div class="grid gap-2">${ms.length?ms.map(p=>`<div class="card p-3 flex justify-between"><span>${p.t}</span><button class="btn card" onclick="openPdf('${p.id}')">Open</button></div>`).join(''):`<div class="card p-4 text-center" style="color:var(--muted)">No bookmarked PDFs yet.</div>`}</div>`;
}

function viewDashboard(){
  const res=state.results;
  const attempted=res.length, solved=res.reduce((a,r)=>a+r.total,0);
  const avg=attempted?Math.round(res.reduce((a,r)=>a+r.pct,0)/attempted):0;
  const daily=JSON.parse(localStorage.getItem('rbse_daily')||'{"last":0,"streak":0}');
  return `${Header('My Dashboard','goBack()')}
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 fade mb-3">
    ${[['Tests Attempted',attempted],['Questions Solved',solved],['Avg Score',avg+'%'],['Streak','🔥 '+daily.streak+'d']].map(([l,v])=>`
      <div class="card p-4 text-center"><div class="font-head text-xl font-bold">${v}</div><div class="text-xs" style="color:var(--muted)">${l}</div></div>`).join('')}
  </div>
  <div class="flex gap-2 mb-5 flex-wrap">
    <button class="btn card" onclick="nav('bookmarks')">🔖 My Bookmarks</button>
    <button class="btn card" onclick="shareProgress()">📤 Share Progress</button>
  </div>
  <h3 class="font-head font-bold mb-2">Recent Tests</h3>
  <div class="grid gap-2">
  ${res.length?res.slice(0,5).map(r=>`<div class="card p-3 flex justify-between"><div>${r.subject==='All'?'All Subjects':r.subject} · ${r.chapter}</div><b style="color:${r.pct>=50?'var(--green)':'var(--red)'}">${r.pct}%</b></div>`).join('')
    :`<div class="card p-6 text-center" style="color:var(--muted)">No tests yet — take one from Subjects!</div>`}
  </div>`;
}

let dailySubject='All';
function viewDaily(){
  const daily=JSON.parse(localStorage.getItem('rbse_daily')||'{"last":0,"streak":0}');
  const diffH=(Date.now()-daily.last)/3600000;
  const canPlay=diffH>=24;
  const remain=canPlay?null:fmtTime(Math.round((24-diffH)*3600));
  const allSubs=['All',...new Set(QBANK.map(q=>q.subject))];
  return `${Header('Daily Test','goBack()')}
  <div class="card p-6 text-center fade">
    <div class="text-3xl">📅</div>
    <div class="font-head text-xl font-bold mt-2">Today's Test</div>
    <div class="mt-1" style="color:var(--muted)">20 Questions · Mixed Difficulty</div>
    <div class="mt-2 text-sm">🔥 Current streak: <b>${daily.streak} day${daily.streak===1?'':'s'}</b> · resets every 24 hours</div>
    <div class="text-left mt-4">
      <label class="text-sm font-semibold">Choose subject</label>
      <div class="flex gap-2 my-2 flex-wrap justify-center" id="dailySubChips">
        ${allSubs.map((s,i)=>`<button class="chip ${dailySubject===s?'active':''}" onclick="pickDailySub('${s}',this)">${s==='All'?'All Subjects':s}</button>`).join('')}
      </div>
    </div>
    ${canPlay
      ?`<button class="btn grad text-white mt-4" onclick="setupSel={count:20,difficulty:'Mixed',type:'Mixed'};startTest(dailySubject,'All',true)">Start Today's Test</button>`
      :`<button class="btn card mt-4" disabled>Come back in ${remain}</button>`}
  </div>`;
}
function pickDailySub(s,el){ dailySubject=s; document.querySelectorAll('#dailySubChips .chip').forEach(c=>c.classList.remove('active')); el.classList.add('active'); }

/* ============ ROUTER / RENDER ============ */
function render(){
  document.documentElement.setAttribute('data-theme',state.dark?'dark':'light');
  const views={home:viewHome,subjects:viewSubjects,stream:viewStream,subject:viewSubject,setup:viewSetup,test:viewTest,
    result:viewResult,review:viewReview,extra:viewExtra,notes:viewNotes,formulas:viewFormulas,bookmarks:viewBookmarks,profile:viewProfile,
    dashboard:viewDashboard,daily:viewDaily,practice:viewPractice,practiceSession:viewPracticeSession};
  document.getElementById('app').innerHTML=(views[state.route]||viewHome)();
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.r===state.route));
}
document.documentElement.setAttribute('data-theme',state.dark?'dark':'light');
render();
</script>
</body>
</html>
